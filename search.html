<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Badman - Search</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{display:flex}.side{width:220px;border-right:1px solid #ddd;height:100vh;padding:20px;position:fixed}.side h1{font-family:cursive}.side a{display:block;text-decoration:none;color:#000;padding:10px;font-weight:600;border-radius:8px}.side a:hover,.side a.active{background:#eee}.main{margin-left:220px;flex:1;padding:20px}.searchbox{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.grid img{width:100%;height:180px;object-fit:cover;border-radius:10px}</style></head>
<body>
<div class="side"><h1>Badman</h1><a href="index.html">Home</a><a href="search.html" class="active">Search</a><a href="explore.html">Explore</a><a href="reels.html">Reels</a><a href="messages.html">Messages</a><a href="notifications.html">Notifications</a><a href="create.html">Create</a><a href="profile.html">Profile</a></div>
<div class="main"><h2>Search</h2><br><input class="searchbox" placeholder="🔍 Search people, places..." oninput="filterUsers(this.value)"><div id="results"></div>
<div class="grid"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=400"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=400"></div></div>
<script>function filterUsers(v){document.getElementById('results').innerHTML=v?'<p style="margin-top:10px">Showing results for <b>'+v+'</b> - <a href="profile.html">View @'+v+'</a></p>':''}</script>
</body></html>
